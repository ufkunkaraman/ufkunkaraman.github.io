<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="migTitle migDesc">
  <title id="migTitle">Zero-Downtime Migration Pipeline from MinIO to RustFS</title>
  <desc id="migDesc">Four-stage migration flow: provision RustFS alongside MinIO, full initial mirror, continuous watch sync with diff verification, and cutover.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <style>
      .bg { fill: #0b0f11; }
      .card { fill: #151a1e; stroke: #263038; stroke-width: 1.5; }
      .card-hi { fill: #111c24; stroke: #38bdf8; stroke-width: 1.5; }
      .pill { fill: #0b0f11; stroke: #334155; stroke-width: 1; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .step { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
      .h { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .t { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .cmd { fill: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .line { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="960" height="360" rx="14" class="bg" />
  <text x="36" y="38" class="step">ZERO-DOWNTIME MIGRATION WORKFLOW</text>
  <text x="36" y="62" class="title">MinIO &#x2192; RustFS Bucket &amp; Workload Cutover</text>

  <!-- Step 1 -->
  <rect x="36" y="96" width="204" height="224" rx="10" class="card" />
  <text x="52" y="124" class="step">STEP 01</text>
  <text x="52" y="148" class="h">Deploy Parallel</text>
  <text x="52" y="172" class="t">Run RustFS alongside</text>
  <text x="52" y="190" class="t">existing MinIO cluster</text>
  <text x="52" y="208" class="t">with .env credentials.</text>
  <rect x="52" y="232" width="172" height="68" rx="6" class="pill" />
  <text x="62" y="254" class="cmd">docker compose up -d</text>
  <text x="62" y="274" class="cmd">mc alias set minio-src</text>
  <text x="62" y="290" class="cmd">mc alias set rustfs-dst</text>

  <path d="M 240 208 L 262 208" class="line" />

  <!-- Step 2 -->
  <rect x="268" y="96" width="204" height="224" rx="10" class="card" />
  <text x="284" y="124" class="step">STEP 02</text>
  <text x="284" y="148" class="h">Initial Bulk Mirror</text>
  <text x="284" y="172" class="t">Copy existing buckets</text>
  <text x="284" y="190" class="t">and objects while</text>
  <text x="284" y="208" class="t">MinIO stays online.</text>
  <rect x="284" y="232" width="172" height="68" rx="6" class="pill" />
  <text x="294" y="256" class="cmd">mc mirror --overwrite</text>
  <text x="294" y="274" class="cmd">  minio-src/</text>
  <text x="294" y="290" class="cmd">  rustfs-dst/</text>

  <path d="M 472 208 L 494 208" class="line" />

  <!-- Step 3 -->
  <rect x="500" y="96" width="204" height="224" rx="10" class="card" />
  <text x="516" y="124" class="step">STEP 03</text>
  <text x="516" y="148" class="h">Delta Sync &amp; Diff</text>
  <text x="516" y="172" class="t">Stream live writes and</text>
  <text x="516" y="190" class="t">verify zero drift across</text>
  <text x="516" y="208" class="t">all mirrored buckets.</text>
  <rect x="516" y="232" width="172" height="68" rx="6" class="pill" />
  <text x="526" y="256" class="cmd">mc mirror --watch</text>
  <text x="526" y="274" class="cmd">mc diff minio-src/bkt</text>
  <text x="526" y="290" class="cmd">  rustfs-dst/bkt</text>

  <path d="M 704 208 L 726 208" class="line" />

  <!-- Step 4 -->
  <rect x="732" y="96" width="192" height="224" rx="10" class="card-hi" />
  <text x="748" y="124" class="step">STEP 04</text>
  <text x="748" y="148" class="h">Endpoint Cutover</text>
  <text x="748" y="172" class="t">Switch DNS / Nginx</text>
  <text x="748" y="190" class="t">upstream and backup</text>
  <text x="748" y="208" class="t">targets, then retire.</text>
  <rect x="748" y="232" width="160" height="68" rx="6" class="pill" />
  <text x="758" y="256" class="cmd">1. Freeze MinIO writes</text>
  <text x="758" y="274" class="cmd">2. Final mc diff check</text>
  <text x="758" y="290" class="cmd">3. Flip DNS / Nginx</text>
</svg>
