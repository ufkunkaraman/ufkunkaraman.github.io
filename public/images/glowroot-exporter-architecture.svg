<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="glowTitle glowDesc">
  <title id="glowTitle">Glowroot APM to Prometheus and Grafana Architecture</title>
  <desc id="glowDesc">Java Tomcat applications attach the Glowroot agent, report to Glowroot Central, get scraped by glowroot-exporter on port 9101, and trigger Prometheus alerts and Grafana dashboard 23125.</desc>
  <defs>
    <marker id="garr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <style>
      .bg { fill: #0b0f11; }
      .card { fill: #151a1e; stroke: #263038; stroke-width: 1.5; }
      .card-hi { fill: #111c24; stroke: #38bdf8; stroke-width: 1.5; }
      .pill { fill: #0b0f11; stroke: #334155; stroke-width: 1; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .step { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
      .h { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .t { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .cmd { fill: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
      .line { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#garr); }
    </style>
  </defs>

  <rect width="960" height="360" rx="14" class="bg" />
  <text x="32" y="38" class="step">JAVA APM OBSERVABILITY FLOW</text>
  <text x="32" y="62" class="title">Tomcat + Glowroot APM &#x2192; glowroot-exporter &#x2192; Prometheus &amp; Grafana</text>

  <!-- Node 1: Tomcat -->
  <rect x="32" y="96" width="196" height="224" rx="10" class="card" />
  <text x="48" y="122" class="step">01 // JVM TARGETS</text>
  <text x="48" y="144" class="h">Apache Tomcat / Java</text>
  <text x="48" y="168" class="t">Attach Glowroot agent</text>
  <text x="48" y="184" class="t">via CATALINA_OPTS</text>
  <text x="48" y="200" class="t">in systemd or K8s pod.</text>
  <rect x="48" y="228" width="164" height="72" rx="6" class="pill" />
  <text x="56" y="250" class="cmd">-javaagent:</text>
  <text x="56" y="268" class="cmd">/opt/glowroot/</text>
  <text x="56" y="284" class="cmd">glowroot.jar</text>

  <path d="M 228 208 L 254 208" class="line" />

  <!-- Node 2: Glowroot Central -->
  <rect x="260" y="96" width="196" height="224" rx="10" class="card" />
  <text x="276" y="122" class="step">02 // APM COLLECTOR</text>
  <text x="276" y="144" class="h">Glowroot Central</text>
  <text x="276" y="168" class="t">Aggregates rollups,</text>
  <text x="276" y="184" class="t">slow traces, and error</text>
  <text x="276" y="200" class="t">counts per agent ID.</text>
  <rect x="276" y="228" width="164" height="72" rx="6" class="pill" />
  <text x="284" y="250" class="cmd">HTTP UI / API</text>
  <text x="284" y="268" class="cmd">Port :4000</text>
  <text x="284" y="284" class="cmd">Agent Rollups</text>

  <path d="M 456 208 L 482 208" class="line" />

  <!-- Node 3: glowroot-exporter -->
  <rect x="488" y="96" width="208" height="224" rx="10" class="card-hi" />
  <text x="504" y="122" class="step">03 // GO EXPORTER</text>
  <text x="504" y="144" class="h">glowroot-exporter</text>
  <text x="504" y="168" class="t">Polls Glowroot API on</text>
  <text x="504" y="184" class="t">configured interval and</text>
  <text x="504" y="200" class="t">exposes Prometheus.</text>
  <rect x="504" y="228" width="176" height="72" rx="6" class="pill" />
  <text x="512" y="250" class="cmd">GET :9101/metrics</text>
  <text x="512" y="268" class="cmd">*_error_total_count</text>
  <text x="512" y="284" class="cmd">*_slow_trace_*</text>

  <path d="M 696 208 L 722 208" class="line" />

  <!-- Node 4: Prometheus + Grafana -->
  <rect x="728" y="96" width="200" height="104" rx="10" class="card" />
  <text x="744" y="122" class="step">04 // SCRAPE &amp; ALERT</text>
  <text x="744" y="144" class="h">Prometheus + Alertmgr</text>
  <text x="744" y="166" class="cmd">scrape_interval: 60s</text>
  <text x="744" y="184" class="cmd">Error / Slow-trace rules</text>

  <rect x="728" y="216" width="200" height="104" rx="10" class="card" />
  <text x="744" y="242" class="step">05 // VISUALIZATION</text>
  <text x="744" y="264" class="h">Grafana Dashboard</text>
  <text x="744" y="286" class="cmd">Dashboard ID: #23125</text>
  <text x="744" y="304" class="cmd">Global / Resource / Error</text>
</svg>
